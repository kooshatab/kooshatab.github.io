name: Prettier code formatter / check

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  prettier:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # Use your Node version

      - name: Install dependencies
        run: npm ci || npm install

      - name: Prettier check
        run: npx prettier . --check --ignore-unknown
